# Downloads GHCN-Daily data, runs the analysis and publishes the report to
# GitHub Pages. Data and the built site live only on the runner, never in git.
name: Build and deploy report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download GHCN-Daily station data
        run: python scripts/download_data.py

      - name: Analyze
        run: python scripts/analyze.py

      - name: Build report
        run: |
          python scripts/build_site.py | tee build.log
          { echo "## Result"; echo; head -n 1 build.log; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
